#
# The FerroFED quickstart: the gateway beside four member CDRs, four FerroEHR
# instances with their own system_ids, on one PostgreSQL server that holds a
# database per node (docs/architecture.md section 13).
#
#   scripts/quickstart/signing-key.sh
#   docker compose up --wait
#   scripts/quickstart/seed.sh
#   curl http://127.0.0.1:8080/health
#   curl -H "Authorization: Bearer $(scripts/quickstart/token.sh)" ...
#
# THE GATEWAY IMAGE. The service runs the published
# ghcr.io/ferrohealth/ferrofed image, which only the release lane builds
# (.github/workflows/release-image.yml); no compose file builds it. The tag
# default is the product version, and scripts/checks/versions.sh keeps it equal
# to the workspace version.
#
# WHAT RUNS. The gateway federates the four nodes below: docker/quickstart/
# registry.toml names them and docker/quickstart/ferrofed.toml configures the
# gateway, both mounted read-only. The configuration is a development profile
# with a static cross-reference from four synthetic patients to their EHRs,
# which scripts/quickstart/seed.sh creates over ITS-REST: a patient at all
# four nodes, one at two, one at one and one at none.
#
# THE SIGNING KEY. The gateway signs the caller's identity onto every request
# to a node with its own key, which scripts/quickstart/signing-key.sh writes
# into docker/quickstart/signing/ once, before the first `docker compose up`:
# a development key, NOT for anything real. Without it the gateway refuses to
# start.
#
# THE NODES. Each runs FerroEHR's documented image and stamps its own system_id
# into every EHR and version it creates. All four use FerroEHR's quickstart
# Basic-auth user, a development credential and NOT for anything real:
#
#   node A  http://127.0.0.1:8081/ferroehr/rest/openehr/v1   ferroehr / ferroehr
#   node B  http://127.0.0.1:8082/ferroehr/rest/openehr/v1   ferroehr / ferroehr
#   node C  http://127.0.0.1:8083/ferroehr/rest/openehr/v1   ferroehr / ferroehr
#   node D  http://127.0.0.1:8084/ferroehr/rest/openehr/v1   ferroehr / ferroehr
#
# THE DATABASE. One FerroEHR PostgreSQL container holds four databases,
# ferroehr_a to ferroehr_d, each owned by a login role of the same name whose
# password is that name too: development credentials, NOT for anything real.
# A database per node, never a schema per node, because FerroEHR creates fixed
# schema names in the database it connects to. Each database admits only its
# own node's role (CONNECT is revoked from PUBLIC), so one node's role is
# refused on another node's database. The nodes still share one server, its
# superuser and its cluster-wide group roles: no production boundary.
#
# PORTS. Every published port binds the loopback interface by default. A
# published port is DNAT'd ahead of the host firewall's own chains, so a port on
# 0.0.0.0 is reachable from the network even when the firewall says otherwise
# (https://docs.docker.com/engine/network/packet-filtering-firewalls/). To serve
# another machine, name the interface (FERROFED_BIND_HOST=10.0.0.7) or put a
# reverse proxy in front.
#
# IMAGES. Every image is pinned by tag and by the digest of its image index,
# and each pin is a row of docs/VERSIONS.md that scripts/checks/versions.sh
# holds equal to this file.

# Without this the project is named after the directory the file sits in, and
# the container, network and volume names move when the directory does.
name: ferrofed

# What the four nodes share; each service below merges it and adds its own
# database, system_id and port.
x-ferroehr-node: &ferroehr-node
  image: ghcr.io/rubentalstra/ferroehr:4.3.1@sha256:b64f752aefe010629191f8c1d990d286c6ed28a62e457300a237a596f1116ac6
  restart: unless-stopped
  depends_on:
    ferroehr-postgres:
      condition: service_healthy
  configs:
    - source: ferroehr-config
      target: /etc/ferroehr/ferroehr.toml
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  # NOT read_only: Compose refuses an inline config in a read-only service,
  # and the inline config below keeps the node configuration in this file.
  tmpfs:
    - /tmp
  healthcheck:
    test: ["CMD", "/usr/local/bin/ferroehr", "healthcheck"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 20s

services:
  ferrofed:
    image: ghcr.io/ferrohealth/ferrofed:${FERROFED_VERSION:-0.0.7}
    container_name: ferrofed
    restart: unless-stopped
    depends_on:
      ferroehr-a:
        condition: service_healthy
      ferroehr-b:
        condition: service_healthy
      ferroehr-c:
        condition: service_healthy
      ferroehr-d:
        condition: service_healthy
    ports:
      - "${FERROFED_BIND_HOST:-127.0.0.1}:${FERROFED_PORT:-8080}:8080"
    environment:
      # The image sets the same value; it is repeated here so the address the
      # container binds is visible in `docker compose config`.
      FERROFED__SERVER__LISTEN: 0.0.0.0:8080
      # `auto` renders pretty output on a terminal and JSON otherwise.
      FERROFED__TELEMETRY__FORMAT: ${FERROFED_LOG_FORMAT:-auto}
      FERROFED__TELEMETRY__FILTER: ${FERROFED_LOG_FILTER:-info}
      FERROFED_CONFIG: /etc/ferrofed/ferrofed.toml
    # The quickstart's configuration and registry document, read-only, so the
    # root filesystem stays read-only as well.
    volumes:
      - ./docker/quickstart/ferrofed.toml:/etc/ferrofed/ferrofed.toml:ro
      - ./docker/quickstart/registry.toml:/etc/ferrofed/registry.toml:ro
      # The quickstart issuer's key set, which scripts/quickstart/token.sh
      # writes on its first run (docker/quickstart/ferrofed.toml, [auth]).
      - ./docker/quickstart/issuer:/etc/ferrofed/issuer:ro
      # The gateway's signing key, which scripts/quickstart/signing-key.sh
      # writes before the first `docker compose up` ([signing]).
      - ./docker/quickstart/signing:/etc/ferrofed/signing:ro
    # The gateway writes nothing: no cache, no scratch file, and every secret is
    # read once at boot. So the root filesystem is read-only with no tmpfs
    # beside it.
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 8192
        hard: 16384
    # Longer than the gateway's 10-second drain (server.shutdown_timeout_ms in
    # docker/quickstart/ferrofed.toml), so `docker compose down` never kills a
    # drain in progress; Docker's default stop timeout is those same 10 seconds.
    stop_grace_period: 20s
    # The image's own HEALTHCHECK, repeated so `docker compose up --wait`
    # visibly waits on it. Readiness gates on the gateway alone, so a member
    # node that is down never marks the gateway unhealthy. An image of a
    # release before v0.0.7 has no `healthcheck` subcommand, so with such a
    # FERROFED_VERSION the service never turns healthy and `--wait` fails.
    healthcheck:
      test: ["CMD", "/usr/local/bin/ferrofed", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # The one database server of the four nodes, FerroEHR's own PostgreSQL image.
  ferroehr-postgres:
    image: ghcr.io/rubentalstra/ferroehr-postgres:4.3.1@sha256:17d5772dba1c6689fccb1095a8774f3ed636f4968256a37fc505207ca75a99b9
    restart: unless-stopped
    environment:
      # The development superuser password of FerroEHR's own quickstart.
      POSTGRES_PASSWORD: ${FERROEHR_POSTGRES_PASSWORD:-postgres}
      # The image's init script creates node A's role and database from the
      # PG_INIT_ keys; the script mounted below runs it again for each name in
      # FERROFED_NODE_DATABASES.
      PG_INIT_USER: ferroehr_a
      PG_INIT_PASSWORD: ferroehr_a
      PG_INIT_DB: ferroehr_a
      FERROFED_NODE_DATABASES: ferroehr_b ferroehr_c ferroehr_d
    volumes:
      - ferroehr-pgdata:/var/lib/postgresql
      # Sorted after the image's own 10-ferroehr-init.sh, which the entrypoint
      # runs first.
      - ./docker/postgres/20-ferrofed-node-databases.sh:/docker-entrypoint-initdb.d/20-ferrofed-node-databases.sh:ro
    # The entrypoint starts as root to chown the data directory and then drops
    # to `postgres`, so it keeps exactly the capabilities that needs.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /run
      - /var/run/postgresql
    healthcheck:
      # Over TCP: the entrypoint's initialisation server listens on the Unix
      # socket alone, so the port answers only once every init script has run
      # and every node database exists.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ferroehr_a -d ferroehr_a"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  ferroehr-a:
    <<: *ferroehr-node
    environment:
      FERROEHR__DB__URL: postgres://ferroehr_a:ferroehr_a@ferroehr-postgres:5432/ferroehr_a
      # The system_id the node stamps into every EHR and version it creates,
      # the one docker/quickstart/registry.toml declares for node-a.
      FERROEHR__SERVER__SYSTEM_ID: node-a.quickstart.local
      FERROEHR__LOG__FORMAT: ${FERROEHR_LOG_FORMAT:-pretty}
    ports:
      - "${FERROFED_BIND_HOST:-127.0.0.1}:${FERROEHR_A_PORT:-8081}:8080"

  ferroehr-b:
    <<: *ferroehr-node
    environment:
      FERROEHR__DB__URL: postgres://ferroehr_b:ferroehr_b@ferroehr-postgres:5432/ferroehr_b
      FERROEHR__SERVER__SYSTEM_ID: node-b.quickstart.local
      FERROEHR__LOG__FORMAT: ${FERROEHR_LOG_FORMAT:-pretty}
    ports:
      - "${FERROFED_BIND_HOST:-127.0.0.1}:${FERROEHR_B_PORT:-8082}:8080"

  ferroehr-c:
    <<: *ferroehr-node
    environment:
      FERROEHR__DB__URL: postgres://ferroehr_c:ferroehr_c@ferroehr-postgres:5432/ferroehr_c
      FERROEHR__SERVER__SYSTEM_ID: node-c.quickstart.local
      FERROEHR__LOG__FORMAT: ${FERROEHR_LOG_FORMAT:-pretty}
    ports:
      - "${FERROFED_BIND_HOST:-127.0.0.1}:${FERROEHR_C_PORT:-8083}:8080"

  ferroehr-d:
    <<: *ferroehr-node
    environment:
      FERROEHR__DB__URL: postgres://ferroehr_d:ferroehr_d@ferroehr-postgres:5432/ferroehr_d
      FERROEHR__SERVER__SYSTEM_ID: node-d.quickstart.local
      FERROEHR__LOG__FORMAT: ${FERROEHR_LOG_FORMAT:-pretty}
    ports:
      - "${FERROFED_BIND_HOST:-127.0.0.1}:${FERROEHR_D_PORT:-8084}:8080"

configs:
  # FerroEHR's quickstart configuration, shared by the four nodes and inline
  # (`$` is escaped as `$$` against Compose interpolation). The Basic-auth user
  # is ferroehr / ferroehr (the hash is Argon2id of "ferroehr"): development
  # credentials only.
  ferroehr-config:
    content: |
      [server]
      bind = "0.0.0.0:8080"

      [auth]
      enabled = true

      [[auth.basic.users]]
      username = "ferroehr"
      password_hash = "$$argon2id$$v=19$$m=19456,t=2,p=1$$ZmVycm9laHJEZXZTYWx0$$be5nPwWjfUl1qvSrvkvqvdMOuCgM0VFcN/VN4MFLjT8"
      roles = ["ADMIN", "USER"]

      [authz.rbac]
      enabled = false

volumes:
  ferroehr-pgdata:
