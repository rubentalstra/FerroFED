#
# The gateway configuration of the compose.yaml quickstart. It federates the
# four nodes of registry.toml and sends each FerroEHR's quickstart Basic-auth
# user: development credentials, NOT for anything real.
#
# A development profile: the static cross-reference below resolves four
# synthetic patients to their EHRs, and it is no identity binding (no
# specification governs it: our own design). scripts/quickstart/seed.sh reads
# the same rows and creates each EHR over ITS-REST, so the two never disagree.
#
# The nodes are reached over plain http inside the Docker network, which only
# the development profile allows for a credential: the gateway starts and
# names each credential that travels unencrypted in its banner and its log.

profile = "development"

[registry]
document = "/etc/ferrofed/registry.toml"

[federation]
# The federation's own identifier, which OPTIONS / names (§7a.2, N30).
id = "quickstart"
per_node_timeout_ms = 10000
overall_timeout_ms = 25000
# No localizer is configured, so every member's cross-reference decides where
# a patient query goes (the ask-all node selection of the specification's
# reference flow, Variant B).
node_selection = "ask-all"

# Every caller authenticates (§13.1, N25). The quickstart trusts one
# development issuer, whose key set scripts/quickstart/token.sh writes on its
# first run into docker/quickstart/issuer/, which compose.yaml mounts here:
# development keys, NOT for anything real. The gateway reads the set when a
# token first needs it, so the key can be made after `docker compose up`.
[auth]
audience = "ferrofed-quickstart"

[[auth.issuer]]
issuer = "ferrofed-quickstart-issuer"
jwks_file = "/etc/ferrofed/issuer/jwks.json"

# The gateway's own ES384 signing key. Every request to a node carries the
# caller's identity in an openEHR-federation-client token signed with it
# (§13.1, N24), and the gateway publishes its public half at jwks_uri.
# scripts/quickstart/signing-key.sh writes it into docker/quickstart/signing/
# before the first `docker compose up`, which compose.yaml mounts here: a
# development key, NOT for anything real. The FerroEHR nodes of the
# quickstart do not verify the token; a node that does fetches the key set
# from jwks_uri, the gateway's address on the compose network.
[signing]
key_file = "/etc/ferrofed/signing/signing-key.pem"
jwks_uri = "http://ferrofed:8080/.well-known/jwks.json"

[credentials."node-a-query"]
user = "ferroehr"
password = "ferroehr"

[credentials."node-b-query"]
user = "ferroehr"
password = "ferroehr"

[credentials."node-c-query"]
user = "ferroehr"
password = "ferroehr"

[credentials."node-d-query"]
user = "ferroehr"
password = "ferroehr"

# The synthetic patients, every identifier inside the example arc
# urn:oid:2.999 that ITU-T X.660 reserves for examples. Each EHR's first group
# names its node and its last group its patient.
#
# ffd-test-0001 has an EHR at all four nodes.
[[dev.crossref]]
namespace = "urn:oid:2.999.1.1"
value = "ffd-test-0001"
member = "node-a"
ehr_id = "aaaaaaaa-aaaa-4aaa-8aaa-000000000001"

[[dev.crossref]]
namespace = "urn:oid:2.999.1.1"
value = "ffd-test-0001"
member = "node-b"
ehr_id = "bbbbbbbb-bbbb-4bbb-8bbb-000000000001"

[[dev.crossref]]
namespace = "urn:oid:2.999.1.1"
value = "ffd-test-0001"
member = "node-c"
ehr_id = "cccccccc-cccc-4ccc-8ccc-000000000001"

[[dev.crossref]]
namespace = "urn:oid:2.999.1.1"
value = "ffd-test-0001"
member = "node-d"
ehr_id = "dddddddd-dddd-4ddd-8ddd-000000000001"

# ffd-test-0002 has an EHR at node B and node D.
[[dev.crossref]]
namespace = "urn:oid:2.999.1.1"
value = "ffd-test-0002"
member = "node-b"
ehr_id = "bbbbbbbb-bbbb-4bbb-8bbb-000000000002"

[[dev.crossref]]
namespace = "urn:oid:2.999.1.1"
value = "ffd-test-0002"
member = "node-d"
ehr_id = "dddddddd-dddd-4ddd-8ddd-000000000002"

# ffd-test-0003 has an EHR at node C alone.
[[dev.crossref]]
namespace = "urn:oid:2.999.1.1"
value = "ffd-test-0003"
member = "node-c"
ehr_id = "cccccccc-cccc-4ccc-8ccc-000000000003"

# ffd-test-0004 has an EHR at no node, so it has no row.
