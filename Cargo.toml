[workspace]
resolver = "3"
members = ["crates/*", "app/*", "tools/*"]
# The fuzz crate needs a nightly toolchain for cargo-fuzz and stays outside the
# workspace; .github/workflows/fuzz.yml builds it on its own (#134).
exclude = ["fuzz"]

[workspace.package]
version = "0.0.7"
edition = "2024"
rust-version = "1.98"
license = "BUSL-1.1"
repository = "https://github.com/FerroHEALTH/FerroFED"
homepage = "https://ferrofed.eu"
authors = ["Ruben Talstra"]
# THE publishing switch (the Cargo reference, the `publish` field; no
# specification governs the policy: our own design). Every crates/* member
# inherits it with publish.workspace = true, so flipping this one value to true
# makes the library crates publishable; app/* and tools/* carry a hard
# publish = false of their own and are never published.
publish = false

# The authoritative third-party set. A crate takes a dependency with
# dep.workspace = true, and every version is checked against crates.io on the
# day it is added (no specification governs this: our own design).
[workspace.dependencies]
# The openEHR surface (ITS-REST, AQL and the RM, from the published crates):
# one lockstep family at the latest published release, moved together by the
# dependency sweep and checked against docs/VERSIONS.md by
# scripts/checks/versions.sh. The pin is 0.0.81, whose ITS-REST crate decodes
# a request into each operation's params, reads a Simplified Formats
# CONTRIBUTION and declares every request-body media type (FerroEHR #3539 to
# #3541, #3543).
openehr-base = "0.0.81"
openehr-rm = "0.0.81"
openehr-query = { version = "0.0.81", features = ["federation"] }
openehr-its = { version = "0.0.81", default-features = false }
# The SMART on openEHR scope grammar alone, with no default feature: the
# scope an onward token is requested with is written and checked with it
# (#81), and every caller's scope claim is read with it (#80).
openehr-sdt = { version = "0.0.81", default-features = false }
# Internal crates. A crates/* member another member depends on takes a path for
# the workspace and a version for its packaged manifest, moved with the member
# (the Cargo reference, Specifying Dependencies, multiple locations); an app/*
# member is never packaged, so it takes the path alone.
openehr-federation = { path = "crates/openehr-federation", version = "0.0.35" }
ihe-iti = { path = "crates/ihe-iti", version = "0.0.13" }
ferrofed-registry = { path = "app/ferrofed-registry" }
ferrofed-identity = { path = "app/ferrofed-identity" }
ferrofed-engine = { path = "app/ferrofed-engine" }
# Path-only, with no version: cargo strips the dev-dependency from a packaged
# crates/* manifest instead of looking it up on crates.io.
ferrofed-testkit = { path = "tools/ferrofed-testkit" }
# The server binary (#29). anyhow is a binary-only error type
# (the anyhow docs.rs page, comparison to thiserror); every library crate
# speaks thiserror.
anyhow = "1.0.104"
thiserror = "2.0.21"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
# Typed carriers only: serde_json::Value is a disallowed type (clippy.toml).
# raw_value lets an open wire object keep the members it does not model as
# raw JSON text (openehr-federation).
serde_json = { version = "1.0.151", features = ["raw_value"] }
# Exact decimal arithmetic for the aggregates the merge recombines across
# nodes (openehr-federation): the decimal type openehr-rm already computes in.
rust_decimal = { version = "1.43.0", default-features = false, features = ["std"] }
# The configuration file format, parsed into the server's Config tree.
toml = { version = "1.1.6", default-features = false, features = ["std", "parse", "display", "serde"] }
secrecy = "0.10.3"
# The onward grant (#81): the ES384 client assertion of RFC 7523 §2.2 is
# signed with it, and its JWK and RFC 7638 thumbprint name the published key.
# aws_lc_rs is its one crypto backend, the provider rustls already builds on;
# enabling a second backend makes it refuse to pick one. Verified against
# crates.io on 2026-10-03.
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["aws_lc_rs", "use_pem"] }
http = "1.5.0"
# The media types and ranges of Accept and Content-Type on a routed request
# (#261; RFC 9110 §8.3, §12.5.1).
mime = "0.3.17"
# The server's HTTP stack and the middleware the binary shape needs.
axum = "0.8.9"
tower = "0.5.3"
tower-http = { version = "0.7.1", default-features = false, features = ["catch-panic", "request-id", "timeout", "limit"] }
tokio = { version = "1.53.1", default-features = false }
tracing = "0.1.44"
# The console: the env filter, the JSON line format and the pretty one.
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "fmt", "env-filter", "json", "ansi"] }
# The metrics surface (#281; no specification governs it: our own design): one
# OpenTelemetry MeterProvider feeds the Prometheus pull reader and the optional
# OTLP push, so an instrument cannot exist on one surface and not the other.
# The four opentelemetry crates are released in lockstep and move together;
# scripts/checks/versions.sh holds them equal against docs/VERSIONS.md.
# Verified against crates.io on 2026-10-03.
opentelemetry = { version = "0.33.0", default-features = false, features = ["metrics", "internal-logs"] }
opentelemetry_sdk = { version = "0.33.0", default-features = false, features = ["metrics", "internal-logs", "rt-tokio", "experimental_metrics_custom_reader"] }
opentelemetry-prometheus = "0.33.0"
opentelemetry-otlp = { version = "0.33.0", default-features = false, features = ["metrics", "internal-logs", "grpc-tonic"] }
# The registry and text encoder the Prometheus reader renders through.
prometheus = { version = "0.14.0", default-features = false }
# The minted request id when a client sends none or sends an illegal one.
uuid = { version = "1.26.1", default-features = false, features = ["v4", "std"] }
# Test-only: a real HTTP client for the cases that drive a real socket.
reqwest = { version = "0.13.5", default-features = false }
tempfile = "3.27.0"
# The identity seams (#36): an object-safe async Resolver trait.
async-trait = "0.1.92"
# Endpoint base URLs in the registry (#36).
url = "2.5.8"
# The one time library (clippy.toml): the `saved` instant of a stored query
# (#77).
jiff = { version = "0.2.37", default-features = false, features = ["std"] }
# The embedded store behind the stored-query registry (#77), reached only from
# the server (app/ferrofed-engine/tests/it/architecture.rs).
redb = { version = "4.3.0", default-features = false, features = ["std"] }
# The shared store behind the stored-query registry where several replicas run
# (#268), behind the server's `postgres` feature: the PostgreSQL client with
# rustls for TLS, its crypto and roots the ones the node client already uses
# (aws-lc-rs, the platform verifier). Verified against crates.io on 2026-10-03.
tokio-postgres = { version = "0.7.18", default-features = false, features = ["runtime"] }
tokio-postgres-rustls = "0.14.0"
rustls = { version = "0.23.45", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
rustls-platform-verifier = "0.7.1"
# The FHIR R4 model of the IHE bindings (PIXm 3.1.0 declares FHIR 4.0.1 in its
# ImplementationGuide), compiled only in crates/ihe-iti and, for its PIX Manager
# test device, in tools/ferrofed-testkit; checked against docs/VERSIONS.md by
# scripts/checks/versions.sh. Each binding names the root set it reads:
# `terminology` for PIXm (#42), `resources` for the PDQm Patient (#119) and the
# mCSD Organization and Endpoint (#74); the testkit's Manager adds `resources`
# for the ITI-104 Patient (#47).
fhir-types = { version = "0.1.107", default-features = false }
# The XML reader and writer of the XCPD ITI-55 SOAP 1.2 and HL7 v3 messages
# (#85), behind crates/ihe-iti's `xcpd` feature; the version fhir-types already
# locks, so the feature adds no crate to the graph. Verified against crates.io
# on 2026-10-03.
quick-xml = { version = "0.42.0", default-features = false }
# The test harness (#39; no specification governs it: our own design): the
# container runner behind the FERROFED_E2E gate, the in-process stub nodes,
# and the HTTP server half the capturing and fault proxy is built on.
testcontainers = "0.28.0"
wiremock = "0.6.5"
hyper = { version = "1.11.1", default-features = false }
hyper-util = { version = "0.1.21", default-features = false }
http-body-util = "0.1.5"
bytes = "1.12.1"
# Test-only for the wire types (#33): schema validation of every emitted body
# (draft 2020-12, the remote resolvers off) and property tests.
jsonschema = { version = "0.58.3", default-features = false }
proptest = "1.11.0"
# Test-only for the wire types (#310): reads the vendored ITS-REST OpenAPI
# YAML the result-set schema's ITS-REST subset is held to; a pure-Rust,
# maintained serde YAML reader. Verified against crates.io on 2026-10-03.
serde-saphyr = { version = "1.3.0", default-features = false, features = ["deserialize"] }
# Test-only for the onward grant (#81): the testkit generates each synthetic
# ES384 signing key at run time with the crypto library rustls and
# jsonwebtoken already build on, so no private key is ever committed, and
# writes it as PEM with the major version jsonwebtoken reads. Verified against
# crates.io on 2026-10-03.
aws-lc-rs = { version = "1.18.1", default-features = false, features = ["aws-lc-sys"] }
pem = { version = "3.0.6", default-features = false, features = ["std"] }

# The reliability bar (no specification governs it: our own design). Groups sit
# at priority -1 so every named lint below overrides its group.
[workspace.lints.rust]
unsafe_code = "forbid"
non_ascii_idents = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
dead_code = "deny"
let_underscore_drop = "deny"
non_local_definitions = "deny"
unexpected_cfgs = "deny"
unsafe_op_in_unsafe_fn = "deny"
ffi_unwind_calls = "deny"
deprecated_safe_2024 = "deny"
ambiguous_negative_literals = "deny"
unused_must_use = "deny"
macro_use_extern_crate = "warn"
absolute_paths_not_starting_with_crate = "warn"
unit_bindings = "warn"
meta_variable_misuse = "warn"
explicit_outlives_requirements = "warn"
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"
unused_lifetimes = "warn"
redundant_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
missing_crate_level_docs = "warn"
invalid_codeblock_attributes = "deny"
invalid_rust_codeblocks = "deny"
invalid_html_tags = "deny"
bare_urls = "deny"
redundant_explicit_links = "deny"
unescaped_backticks = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
# Panics are for states that cannot happen; everything else is a Result.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
unimplemented = "deny"
todo = "deny"
panic_in_result_fn = "deny"
missing_assert_message = "deny"
indexing_slicing = "deny"
string_slice = "deny"
# Numeric honesty: no silent narrowing, wrapping, or lossy literals.
as_conversions = "deny"
float_cmp_const = "deny"
lossy_float_literal = "deny"
as_underscore = "deny"
fn_to_numeric_cast_any = "deny"
precedence_bits = "deny"
suspicious_xor_used_as_pow = "deny"
integer_division = "warn"
unchecked_time_subtraction = "deny"
# Guards, results, and causes are never dropped on the floor.
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
unused_result_ok = "deny"
map_err_ignore = "warn"
# Determinism: hash iteration order feeds nothing that must be stable.
iter_over_hash_type = "deny"
# Libraries speak tracing; only binaries write to stdio, and nothing exits.
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
exit = "deny"
# Suppressions are scoped, justified, and self-reporting.
allow_attributes_without_reason = "deny"
allow_attributes = "warn"
# Documentation and comment shape (RFC 505 and RFC 1574).
too_long_first_doc_paragraph = "warn"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
# The RFC 3107 shape: derive Default when the default is a variant.
derivable_impls = "deny"
# API hygiene: no re-exports, no pointer leakage, the right std call.
pub_use = "deny"
incompatible_msrv = "deny"
verbose_file_reads = "deny"
filetype_is_file = "deny"
create_dir = "deny"
large_include_file = "deny"
rc_buffer = "deny"
rc_mutex = "deny"
mem_forget = "deny"
pointer_format = "deny"
empty_drop = "warn"
deref_by_slicing = "warn"

# A clean 500 relies on catch_unwind, which only catches unwinding panics, and
# tests ignore the panic setting, so abort would be untestable
# (https://doc.rust-lang.org/cargo/reference/profiles.html#panic).
[profile.release]
panic = "unwind"
overflow-checks = true
debug = "line-tables-only"
