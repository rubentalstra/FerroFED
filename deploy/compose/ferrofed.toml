#
# The gateway configuration of the release compose.yaml, which mounts this
# file read-only at /etc/ferrofed/ferrofed.toml. It federates the two example
# members of registry.toml through one PIX Manager. Replace every value marked
# EDIT with your own; every value here is a placeholder (example.org hosts,
# identifiers in the urn:oid:2.999 example arc).
#
# A credential is never written here. Each one is a file in secrets/ beside
# compose.yaml, mounted read-only at /run/secrets/ferrofed/, and named below
# by a `_file` key. The gateway runs as uid 65532, so that user must be able
# to read each file. Every URL a credential is sent to is https: under the
# production profile the gateway refuses a credential sent over plain http.
#
# Every key, with its default, is in the book:
# https://ferrofed.eu/docs/operate/configuration.html. A value the gateway
# refuses stops it with exit code 78 and one line naming the key, which
# `docker compose logs ferrofed` shows.

# `production` admits no development cross-reference.
profile = "production"

[server]
# The image sets FERROFED__SERVER__LISTEN to this same address, which takes
# precedence; compose.yaml publishes port 8080.
listen = "0.0.0.0:8080"
request_timeout_ms = 30000
# The drain after SIGTERM; compose.yaml's stop_grace_period stays longer.
shutdown_timeout_ms = 10000

[telemetry]
# auto renders pretty output on a terminal and JSON otherwise.
format = "auto"
filter = "info,hyper=warn,tower=warn,h2=warn"

[registry]
document = "/etc/ferrofed/registry.toml"
format = "toml"

# To read the members from an IHE mCSD care services directory instead, and
# keep them in step with it, remove `document` and `format` above and set the
# directory's FHIR base. Its Organization and Endpoint resources carry the
# registry ids as the FHIR form of the registry does.
# [registry.mcsd]
# url = "https://directory.example.org/fhir"   # EDIT
# refresh_interval_s = 300
# deadline_ms = 30000   # one read or refresh, every page
# max_pages = 200
# max_bytes = 67108864
# max_entries = 50000
#
# [registry.mcsd.credentials]
# bearer_token_file = "/run/secrets/ferrofed/directory-token"

[federation]
# EDIT: your federation's identifier, which OPTIONS / names.
id = "example-federation"
node_selection = "ask-all"
per_node_timeout_ms = 10000
overall_timeout_ms = 25000
# The namespace a patient identifier without one resolves in; without it,
# such a query is refused with a 400.
# default_namespace = "urn:oid:2.999.1"

# Client authentication: every caller presents an RFC 9068 access token from
# an issuer listed here, with a SMART on openEHR scope for the operation and a
# purpose of use. A gateway that federates refuses to start without an issuer.
# https://ferrofed.eu/docs/operate/authentication.html
[auth]
# EDIT: the audience your issuers name this gateway by in `aud`.
audience = "https://gateway.example.org/fed"
# The clock skew allowed on exp and nbf, at most 300 seconds.
clock_skew_s = 60
# A token with no purpose of use is refused (§13.4). Set false only with the
# reason recorded in your deployment's security decisions.
# [auth.purpose_of_use]
# required = true

# EDIT: an authorization server your callers get their tokens from. Verify
# its tokens by its JWK Set (jwks_uri, or jwks_file for keys handed over out
# of band), or by RFC 7662 introspection.
[[auth.issuer]]
issuer = "https://idp.example.org"
jwks_uri = "https://idp.example.org/jwks"
# The client_ids whose system/aql-* grant is honoured.
# backend_clients = ["example-reporting-service"]
# The client_ids admitted to the DEMOGRAPHIC API.
# demographic_clients = []
#
# Introspection instead of jwks_uri:
# introspection_endpoint = "https://idp.example.org/introspect"
# client_id = "ferrofed"
# client_secret_file = "/run/secrets/ferrofed/introspection-secret"

# The identity service: an IHE PIXm PIX Manager.
# https://ferrofed.eu/docs/operate/identity.html
[[pixm.manager]]
# EDIT: the Manager's FHIR base URL.
url = "https://pix.example.org/fhir/"

# EDIT: every node of registry.toml, mapped to its ehr_id domain at the
# Manager. A node missing here refuses the configuration.
[pixm.manager.members]
"node-a" = "urn:oid:2.999.10"
"node-b" = "urn:oid:2.999.20"

# How the gateway authenticates to the Manager. Remove the section when the
# transport does, or use `user` with `password_file` instead.
[pixm.manager.credentials]
bearer_token_file = "/run/secrets/ferrofed/pix-token"

# A client namespace mapped to the assigning authority the Manager knows it
# by; a namespace that is itself an absolute URI needs no entry.
# [pixm.namespaces]
# "2.999.1" = "urn:oid:2.999.1"

# EDIT: the credentials the gateway sends each endpoint of registry.toml, one
# section per endpoint id: a bearer token, or a user and a password. Leave an
# endpoint out when it needs none.
[credentials."node-a-query"]
bearer_token_file = "/run/secrets/ferrofed/node-a-token"

[credentials."node-b-query"]
user = "ferrofed"
password_file = "/run/secrets/ferrofed/node-b-password"

# Or OAuth 2.0 client credentials with a signed JWT client assertion, the
# default onward mechanism of the Federation Tier (§13.1): the gateway
# obtains a token at the node's token endpoint and sends that. Use it in
# place of the section above for that endpoint, and set [signing] below.
# https://ferrofed.eu/docs/operate/configuration.html#oauth-20-to-a-node
# [credentials."node-b-query".oauth2]
# grant = "client_credentials"
# client_auth = "private_key_jwt"
# token_endpoint = "https://auth.node-b.example.org/oauth2/token"
# client_id = "ferrofed-gateway"
# scope = "system/aql-*.s"

# The gateway's ES384 signing key, in PKCS#8 PEM, which signs every client
# assertion; the gateway publishes its public key at
# /.well-known/jwks.json and declares jwks_uri in OPTIONS /. Make one with:
#   openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-384 \
#     -out secrets/signing-key.pem
# [signing]
# key_file = "/run/secrets/ferrofed/signing-key.pem"
# # EDIT: the address the nodes fetch the JWK Set from.
# jwks_uri = "https://gateway.example.org/.well-known/jwks.json"
